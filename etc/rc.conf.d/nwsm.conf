# Preserve the graphical session environment for OpenRC user services.
# nwsm publishes these values after the compositor becomes ready, and
# supervise-daemon must pass them through to the service processes.
rc_env_allow="DBUS_SESSION_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY XDG_SESSION_DESKTOP ELECTRON_OZONE_PLATFORM_HINT GDK_BACKEND GTK_USE_PORTAL QT_AUTO_SCREEN_SCALE_FACTOR QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME SDL_VIDEODRIVER XCURSOR_SIZE XCURSOR_THEME HYPRLAND_INSTANCE_SIGNATURE HYPRLAND_CMD HYPRCURSOR_SIZE HYPRCURSOR_THEME"
