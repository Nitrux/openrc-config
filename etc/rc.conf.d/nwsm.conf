# Preserve the graphical session environment for OpenRC user services.
# nwsm publishes these values after the compositor becomes ready, and
# supervise-daemon must pass them through to the service processes.
# nwsm dynamically publishes the compositor XDG_* environment, but this
# allowlist intentionally contains only stable values appropriate to every
# desktop service; transient values such as XDG_ACTIVATION_TOKEN are excluded.
rc_env_allow="DBUS_SESSION_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY XDG_BACKEND XDG_CACHE_HOME XDG_CONFIG_DIRS XDG_CONFIG_HOME XDG_CURRENT_DESKTOP XDG_DATA_DIRS XDG_DATA_HOME XDG_RUNTIME_DIR XDG_SESSION_DESKTOP XDG_SESSION_ID XDG_SESSION_PATH XDG_SESSION_TYPE XDG_SEAT XDG_SEAT_PATH XDG_STATE_HOME XDG_VTNR PAM_KWALLET5_LOGIN ELECTRON_OZONE_PLATFORM_HINT GDK_BACKEND GTK_USE_PORTAL QT_AUTO_SCREEN_SCALE_FACTOR QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME SDL_VIDEODRIVER XCURSOR_SIZE XCURSOR_THEME HYPRLAND_INSTANCE_SIGNATURE HYPRLAND_CMD HYPRCURSOR_SIZE HYPRCURSOR_THEME"
